name = "photospeak-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Local dev secrets live in .dev.vars (gitignored).
# Production secrets are set via:
#   wrangler secret put MIMO_API_KEY
#   wrangler secret put DASHSCOPE_API_KEY
#   wrangler secret put APP_SHARED_TOKEN
#
# To list/remove:
#   wrangler secret list
#   wrangler secret delete <NAME>

# Public, non-secret vars can go here:
# [vars]
# LOG_LEVEL = "info"

# Observability (optional, free tier):
# [observability]
# enabled = true
